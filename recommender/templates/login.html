<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        padding: 20px;
    }

    .login-container {
        width: 100%;
        max-width: 420px;
    }

    .login-card {
        background: #ffffff;
        padding: 40px;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-header h1 {
        color: #222;
        font-size: 30px;
        margin-bottom: 8px;
    }

    .login-header p {
        color: #777;
        font-size: 14px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        color: #333;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .form-group input {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: all 0.2s ease;
    }

    .form-group input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    .messages {
        margin-bottom: 20px;
    }

    .message {
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 8px;
    }

    /* Success message - GREEN */
    .message.success {
        background: #effaf3;
        color: #218838;
        border: 1px solid #b7e4c7;
    }

    /* Error message - RED */
    .message.error {
        background: #fff0f0;
        color: #d93025;
        border: 1px solid #ffd0d0;
    }

    /* Warning message - YELLOW */
    .message.warning {
        background: #fff8e6;
        color: #856404;
        border: 1px solid #ffe8a1;
    }

    /* Information message - BLUE */
    .message.info {
        background: #eef6ff;
        color: #0056b3;
        border: 1px solid #b8daff;
    }

    .login-button {
        width: 100%;
        border: none;
        padding: 14px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 16px;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
    }

    .login-button:active {
        transform: translateY(0);
    }

    /* Register section */
    .register-section {
        text-align: center;
        margin-top: 22px;
        padding-top: 20px;
        border-top: 1px solid #eeeeee;
    }

    .register-text {
        color: #777;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .register-link {
        color: #667eea;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s ease;
    }

    .register-link:hover {
        color: #764ba2;
        text-decoration: underline;
    }

    .footer {
        text-align: center;
        margin-top: 25px;
        color: #999;
        font-size: 13px;
    }

    @media (max-width: 480px) {
        .login-card {
            padding: 30px 22px;
        }

        .login-header h1 {
            font-size: 26px;
        }
    }
</style>


<div class="login-container">

    <div class="login-card">

        <div class="login-header">

            <h1>Welcome Back</h1>

            <p>
                Sign in to your account to continue
            </p>

        </div>


        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>


        <!-- Register -->

        <div class="register-section">

            <div class="register-text">
                Don't have an account?
            </div>

            <a
                href="{% url 'register' %}"
                class="register-link"
            >
                Create an account
            </a>

        </div>


        <div class="footer">
            &copy; 2026 Recommendation System.
            All rights reserved.
        </div>

    </div>

</div>
