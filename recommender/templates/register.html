<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 450px;
        }

        .register-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            color: #222;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .register-header p {
            color: #777;
            font-size: 14px;
        }

        /* Django form styling */
        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        form input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        form input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        /* Django help text */
        form .helptext {
            display: block;
            color: #888;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 6px;
        }

        /* Django validation errors */
        form ul.errorlist {
            list-style: none;
            color: #d93025;
            background: #fff0f0;
            border: 1px solid #ffd0d0;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .register-button {
            width: 100%;
            border: none;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 5px;
        }

        .register-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .register-button:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 30px 22px;
            }

            .register-header h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="register-header">
                <h1>Create Account</h1>
                <p>Register your account to get started</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="register-button">
                    Create Account
                </button>
            </form>

            <div class="login-link">
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </div>

        </div>

    </div>

</body>
</html>
